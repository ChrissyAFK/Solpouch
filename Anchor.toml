[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
solpouch_vault = "AqixXTfd8n914z7QCsNmBuZcFbDsitbGrBfCHStmJT8F"

[programs.localnet]
solpouch_vault = "AqixXTfd8n914z7QCsNmBuZcFbDsitbGrBfCHStmJT8F"

# localnet so a plain `anchor test` never deploys to devnet.
# Deploy to devnet explicitly: `anchor deploy --provider.cluster devnet`.
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
