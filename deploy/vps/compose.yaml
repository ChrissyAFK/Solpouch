# Solpouch on one server: Caddy terminates TLS and proxies to the web and API images from ghcr.
# Run from this folder: docker compose up -d   (see docs/DEPLOY.md)
services:
  api:
    image: ghcr.io/chrissyafk/solpouch-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Only Caddy (fixed address below) may set the client IP the rate limiter sees.
      TRUSTED_PROXY_IPS: 172.30.0.2
      TRUSTED_PROXY_HEADER: x-forwarded-for
    volumes:
      # Keypairs: the backend reads .keys/owner.json and .keys/agent.json from /app.
      - ./keys:/app/.keys:ro
    networks:
      edge:
        ipv4_address: 172.30.0.3

  web:
    image: ghcr.io/chrissyafk/solpouch-web:${TAG:-latest}
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.0.4

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:-api.solpouch.tech}
      WEB_HOST: ${WEB_HOST:-solpouch.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks:
      edge:
        ipv4_address: 172.30.0.2

networks:
  edge:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  caddy_data: {}
  caddy_config: {}
