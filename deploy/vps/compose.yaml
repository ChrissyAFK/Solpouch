# Solpouch on the shared VPS. The server's existing Caddy (shared-automation-proxy-1) owns 80/443
# and reaches these containers over its trading-os-edge network; nothing is published on the host.
# Run from ~/solpouch: docker compose up -d   (see docs/DEPLOY.md)
name: solpouch

services:
  api:
    image: ghcr.io/chrissyafk/solpouch-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Only the shared Caddy may set the client IP the rate limiter sees. PROXY_IP is its address on
      # trading-os-edge, set in .env. If it changes, every client shares one rate-limit bucket until fixed.
      TRUSTED_PROXY_IPS: ${PROXY_IP:?set PROXY_IP in .env}
      TRUSTED_PROXY_HEADER: x-forwarded-for
    volumes:
      # Keypairs: the backend reads .keys/owner.json and .keys/agent.json from /app.
      - ./keys:/app/.keys:ro
      # Postgres CA: set DATABASE_CA_CERT=/app/certs/timescale-ca.pem in .env.
      - ./certs:/app/certs:ro
    mem_limit: 768m
    networks:
      edge:
        # Unique names so they can't clash with other stacks' "api" or "web" on the shared network.
        aliases: [solpouch-api]

  web:
    image: ghcr.io/chrissyafk/solpouch-web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m
    networks:
      edge:
        aliases: [solpouch-web]

networks:
  edge:
    external: true
    name: trading-os-edge
