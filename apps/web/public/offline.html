<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101014" />
    <title>Offline | Solpouch</title>
    <style>
      /* Self-contained on purpose: the service worker serves this file when nothing else can load. */
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #101014; color: #f4f4f6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { font-size: 1rem; line-height: 1.5; color: #a9a9b6; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; color: #101014; background: #14f195;
        border: 0; border-radius: 10px; padding: 12px 22px; min-height: 48px; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path d="M164 150h218l-34 48H130z" fill="#14f195"/><path d="M130 232h218l34 48H164z" fill="#a78bfa"/><path d="M164 314h218l-34 48H130z" fill="#14f195"/></svg>
      <h1>You're offline</h1>
      <p>Solpouch needs a connection to show balances and orders. Nothing was changed while you were away.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
